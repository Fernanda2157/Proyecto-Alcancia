<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rama 3 — DDD</title>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <style>
        body { background: #f5f5f5; }
        .header-band { background: #27ae60; color: white; padding: 18px 0; margin-bottom: 30px; }
        .header-band h2 { margin: 0; font-size: 22px; }
        .header-band p  { margin: 4px 0 0; opacity: 0.85; font-size: 13px; }
        .badge-rama { background: rgba(255,255,255,0.25); border-radius: 4px; padding: 3px 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: white; border-radius: 6px; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .progress { height: 18px; border-radius: 9px; }
        .progress-bar { font-size: 12px; line-height: 18px; font-weight: bold; }
        .stat-row { display: flex; gap: 8px; margin: 12px 0; }
        .stat-item { flex: 1; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 8px; text-align: center; }
        .stat-item .v { font-size: 16px; font-weight: bold; color: #2c3e50; }
        .stat-item .l { font-size: 10px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="header-band">
    <div class="container">
        <span class="badge-rama">DDD — Enfoque de Dominio</span>
        <h2> Alcancía Digital</h2>
        
</div>
<div class="container">
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger"  th:text="${error}"></div>

    <div class="row" style="margin-bottom:15px;">
        <div class="col-sm-8"><h3 style="margin-top:5px;">Todas las Alcancías</h3></div>
        <div class="col-sm-4 text-right">
            <a th:href="@{/alcancia/nueva}" class="btn btn-success">+ Nueva Alcancía</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(alcancias)}" class="text-center" style="padding:40px; color:#999;">
        <h4>No hay alcancías. Crea la primera.</h4>
        <a th:href="@{/alcancia/nueva}" class="btn btn-success">Crear alcancía</a>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(alcancias)}">
        <div th:each="a : ${alcancias}" class="col-sm-6 col-md-4">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <strong th:text="${a.nombreAhorrista}" style="font-size:16px;"></strong>
                    <span th:if="${a.completada}"  class="label label-success">COMPLETADA</span>
                    <span th:unless="${a.completada}" class="label label-warning">ACTIVA</span>
                </div>
                <div class="progress">
                    <div class="progress-bar"
                         th:classappend="${a.completada} ? 'progress-bar-success' : 'progress-bar-success'"
                         th:style="'width:' + ${a.porcentaje} + '%'"
                         th:text="${#numbers.formatDecimal(a.porcentaje,1,1)} + '%'">
                    </div>
                </div>
                <div class="stat-row">
                    <div class="stat-item"><div class="v" th:text="'$'+${a.saldo}"></div><div class="l">Saldo</div></div>
                    <div class="stat-item"><div class="v" th:text="'$'+${a.meta}"></div><div class="l">Meta</div></div>
                    <div class="stat-item">
                        <div class="v" th:text="${a.completada} ? '¡Listo!' : '$'+${#numbers.formatDecimal(a.faltante,1,2)}"></div>
                        <div class="l">Falta</div>
                    </div>
                </div>
                <a th:href="@{/alcancia/{id}(id=${a.id})}" class="btn btn-default btn-block btn-sm">Ver detalle</a>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script src="https://netdna.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
