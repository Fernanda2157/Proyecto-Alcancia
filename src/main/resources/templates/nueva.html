<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Alcancía — Rama 3 DDD</title>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <style>
        body { background: #f5f5f5; }
        .header-band { background: #27ae60; color: white; padding: 18px 0; margin-bottom: 30px; }
        .header-band h2 { margin: 0; font-size: 22px; }
        .card { background: white; border-radius: 6px; border: 1px solid #ddd; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .note-ddd { background:#eafaf1; border-left:4px solid #27ae60; border-radius:4px; padding:10px 14px; font-size:12px; color:#555; margin-top:15px; }
    </style>
</head>
<body>
<div class="header-band">
    <div class="container">
        <h2> Nueva Alcancía — Rama 3 (DDD)</h2>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="card">
                <h4 style="margin-top:0;">Crear Nueva Alcancía</h4>
                <hr>
                <form th:action="@{/alcancia/nueva}" method="post">
                    <div class="form-group">
                        <label>Nombre del Ahorrista *</label>
                        <input type="text" name="nombre" class="form-control"
                               placeholder="Ej: María García" required>
                        <span class="help-block" style="font-size:11px;">Validado por el Aggregate Root</span>
                    </div>
                    <div class="form-group">
                        <label>Meta de Ahorro ($) *</label>
                        <input type="number" name="meta" class="form-control"
                               placeholder="Ej: 500.00" step="0.01" min="0.01" required>
                        <span class="help-block" style="font-size:11px;">Validado por el Value Object Monto</span>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button type="submit" class="btn btn-success btn-block">Crear Alcancía</button>
                        <a th:href="@{/alcancia/lista}" class="btn btn-default btn-block">Cancelar</a>
                    </div>
                </form>

              
            </div>
        </div>
    </div>
</div>
</body>
</html>
